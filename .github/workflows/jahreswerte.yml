name: Jahreswerte prüfen

# Wie Renovate, aber für amtliche Werte: beobachtet BMF-Steuerrechner (Lohnsteuer-PAP, Einkommensteuertarif),
# gesetze-im-internet.de (Sozialversicherungsrechengrößen, Normen in scripts/jahreswerte/normen.json), download.elster.de
# (ERiC) und den DATEV-Shop (SKR03/SKR04) und öffnet je Befund ein Issue mit dem Label „jahreswerte“. Ein offenes Issue
# mit derselben Kennung bekommt kein zweites, bei geändertem Befund einen Kommentar. Eine Quelle, die nicht antwortet,
# ist nur eine Warnung. Was dann zu tun ist: docs/entwicklung.md, „Jahreswerte: Erinnerung per Workflow“.
on:
  schedule:
    # Montags früh (UTC); der BMF veröffentlicht den PAP meist im November, die SV-Werte erscheinen im November
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: jahreswerte
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/jahreswerte/pruefen.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
