name: Release

# Ein Tag vX.Y.Z (pnpm version patch|minor|major && git push --follow-tags) veröffentlicht diese
# Version: erst die komplette CI, dann der gemeinsame Docker-Release aus firsttris/workflows. Der
# prüft den Tag gegen package.json, pusht :x.y.z, :x.y und :latest auf Docker Hub und GHCR
# (amd64 und arm64), aktualisiert die Beschreibung auf Docker Hub und legt danach das GitHub-Release an.
# Von Hand auf main gestartet: dieselben Prüfungen, dann das Image als :edge; kein Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: checks
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: tristanteu/haben
      description: "Selbst gehostete Buchhaltung für Freiberufler: E-Rechnung, Bankabgleich, EÜR, ELSTER-Voranmeldung"
      dockerfile: Containerfile
      ghcr: true
    secrets: inherit
    permissions:
      contents: write
      packages: write
