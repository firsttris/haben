name: Release

# Ein Tag vX.Y.Z (Button in bump.yml oder pnpm release:patch|minor|major) veröffentlicht diese
# Version: erst die komplette CI (übersprungen, wenn die CI auf main denselben Code schon geprüft hat,
# siehe https://github.com/firsttris/workflows#tested-on-main), dann der gemeinsame Docker-Release
# aus firsttris/workflows. Der prüft den Tag gegen package.json, pusht :x.y.z, :x.y und :latest auf
# Docker Hub und GHCR (amd64 und arm64), aktualisiert die Beschreibung auf Docker Hub und legt
# danach das GitHub-Release an. Ein Release Candidate vX.Y.Z-rc.N pusht stattdessen :x.y.z-rc.N und
# :next, wird ein Pre-release auf GitHub und lässt :latest und die Beschreibung auf Docker Hub stehen.
# Von Hand auf main gestartet: dieselben Prüfungen, dann das Image als :edge; kein Release.
# Das Backup-Image tristanteu/haben-backup (deploy/backup) erscheint mit denselben Tags, damit App und
# Backup zur selben Postgres-Version passen; das GitHub-Release legt nur der Lauf der App an.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Standard für alle Jobs; Jobs, die mehr brauchen, setzen eigene permissions
permissions:
  contents: read

jobs:
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@main
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write # der Image-Test der CI hält seinen Build-Cache

  docker:
    needs: [tested, checks]
    # Die Prüfungen liefen durch oder waren nicht nötig
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@main
    with:
      image: tristanteu/haben
      description: "Selbst gehostete Buchhaltung für Freiberufler: E-Rechnung, Bankabgleich, EÜR, ELSTER-Voranmeldung"
      dockerfile: Containerfile
      ghcr: true
    secrets: inherit
    permissions:
      contents: write
      packages: write

  docker-backup:
    needs: [tested, checks]
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@main
    with:
      image: tristanteu/haben-backup
      description: "Backup für Haben: pg_dump und Belegdateien, verschlüsselt mit restic"
      dockerfile: deploy/backup/Containerfile
      context: deploy/backup
      ghcr: true
      ghcr-image: firsttris/haben-backup
      readme: deploy/backup/README.md
      github-release: false
    secrets: inherit
    permissions:
      contents: write
      packages: write
