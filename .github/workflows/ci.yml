name: CI

# Changes to documentation alone don't build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # Der Release-Workflow lässt vor dem Veröffentlichen dieselben Prüfungen laufen.
  workflow_call:

# Standard für alle Jobs; Jobs, die mehr brauchen, setzen eigene permissions
permissions:
  contents: read

# Ein neuer Push in einen Pull Request bricht dessen veralteten Lauf ab; Läufe auf main und Tags laufen zu Ende
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft-Pull-Requests bauen nicht; "Ready for review" startet den Lauf
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: haben
          POSTGRES_PASSWORD: haben
          POSTGRES_DB: haben_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haben"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://haben:haben@localhost:5432/haben_test
      - run: pnpm build

  e2e:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: haben
          POSTGRES_PASSWORD: haben
          POSTGRES_DB: haben_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haben"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @haben/web exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Ende-zu-Ende-Tests mit Screenshots aller Seiten
        run: pnpm e2e
        env:
          E2E_DATABASE_URL: postgres://haben:haben@localhost:5432/haben_e2e
          # Der gebaute Server statt des Entwicklungsservers
          E2E_SERVER_COMMAND: node .output/server/index.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  kosit:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: KoSIT-Validator und XRechnung-Konfiguration laden
        run: |
          mkdir -p "$RUNNER_TEMP/kosit/validator" "$RUNNER_TEMP/kosit/xr"
          curl -sSfL -o "$RUNNER_TEMP/validator.zip" https://github.com/itplr-kosit/validator/releases/download/v1.5.0/validator-1.5.0-distribution.zip
          curl -sSfL -o "$RUNNER_TEMP/xr.zip" https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/release-2025-07-10/validator-configuration-xrechnung_3.0.2_2025-07-10.zip
          unzip -q "$RUNNER_TEMP/validator.zip" -d "$RUNNER_TEMP/kosit/validator"
          unzip -q "$RUNNER_TEMP/xr.zip" -d "$RUNNER_TEMP/kosit/xr"
          echo "KOSIT_JAR=$(find "$RUNNER_TEMP/kosit/validator" -name 'validationtool-*-standalone.jar' ! -name '*java8*' | head -n1)" >> "$GITHUB_ENV"
          echo "KOSIT_CONFIG=$RUNNER_TEMP/kosit/xr/scenarios.xml" >> "$GITHUB_ENV"
      - run: pnpm --filter @haben/einvoice kosit "$RUNNER_TEMP/kosit/out"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosit-reports
          path: ${{ runner.temp }}/kosit/out
          if-no-files-found: ignore

  container:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -f Containerfile -t haben:ci .
      - name: Mit PostgreSQL starten
        run: |
          docker network create haben
          docker run -d --name haben-db --network haben -e POSTGRES_USER=haben -e POSTGRES_PASSWORD=haben -e POSTGRES_DB=haben postgres:16
          # Das Postgres-Image startet nach der Initialisierung einmal neu; erst danach ist es bereit
          for i in $(seq 1 60); do [ "$(docker logs haben-db 2>&1 | grep -c 'ready to accept connections')" -ge 2 ] && break; sleep 1; done
          docker run -d --name haben-app --network haben -p 3000:3000 \
            -e DATABASE_URL=postgres://haben:haben@haben-db:5432/haben \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e HABEN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e ELSTER_HERSTELLER_ID= \
            haben:ci
      - name: Prüfen
        run: |
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/login
          docker logs haben-app 2>&1 | grep -q "Migrationen angewendet"
          docker exec haben-app sh -c 'cd /app/packages/elster && node -e "require.resolve(\"koffi\")"'
      - if: failure()
        run: docker logs haben-app || true
