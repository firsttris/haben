name: CI

# Reine Doku-Änderungen bauen nicht. Auf main filtert paths-ignore. Für Pull Requests geht das nicht: Ohne Lauf
# bleiben die auf main geforderten Checks „Pending“ und blockieren den Merge (GitHub-Doku „Troubleshooting required
# status checks“, „Handling skipped but required checks“). Dort überspringt deshalb der Job changes die Prüfungen.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Der Release-Workflow lässt vor dem Veröffentlichen dieselben Prüfungen laufen.
  workflow_call:

# Standard für alle Jobs; Jobs, die mehr brauchen, setzen eigene permissions
permissions:
  contents: read

# Ein neuer Push in einen Pull Request bricht dessen veralteten Lauf ab; Läufe auf main und Tags laufen zu Ende
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stellt fest, ob ein Pull Request nur Markdown, docs/ oder LICENSE ändert. Ein Job, der per if übersprungen wird,
  # zählt für die Regeln auf main als Erfolg, auch wenn er nur wegen eines fehlgeschlagenen needs-Jobs ausfällt. Darum
  # steht in jedem Job !cancelled() und der Vergleich mit 'false': Läuft changes nicht (push, Release, Entwurf) oder
  # schlägt fehl, ist die Ausgabe leer und die Prüfungen laufen
  changes:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Der Merge-Commit des Pull Requests und sein erster Elternteil, die Basis
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        run: |
          set -euo pipefail
          # --no-renames: Eine umbenannte Datei zählt mit altem und neuem Pfad, Code wird nicht durch Verschieben zu Doku
          changed="$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed"
          other="$(grep -Ev '\.md$|^docs/|^LICENSE$' <<< "$changed" || true)"
          # Gelöscht oder verschoben zählt als Code: normen.test.ts verlangt die Seiten aus scripts/jahreswerte/normen.json
          deleted="$(git diff --no-renames --diff-filter=D --name-only HEAD^1 HEAD)"
          if [ -n "$changed" ] && [ -z "$other" ] && [ -z "$deleted" ]; then code=false; else code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Lint und Typecheck brauchen keine Datenbank; gebaut wird in den Jobs e2e-teil
  check:
    # Draft-Pull-Requests bauen nicht; "Ready for review" startet den Lauf
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  test:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: haben
          POSTGRES_PASSWORD: haben
          POSTGRES_DB: haben_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haben -d haben_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Die Datenbank ist nach dem Job weg: ohne Schreiben auf die Platte bei jedem Commit
      - name: PostgreSQL ohne fsync
        run: docker exec ${{ job.services.postgres.id }} psql -U haben -d haben_test -qc "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      # pdftoppm wandelt PDFs für einen selbst betriebenen KI-Dienst in Seitenbilder (wie im Image)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      # Jeder Worker von Vitest klont seine Datenbank aus einer Vorlage (apps/web/src/server/test-db.ts)
      - run: bun run test
        env:
          TEST_DATABASE_URL: postgres://haben:haben@localhost:5432/haben_test

  # Drei Teile parallel (Playwright --shard). Jeder Teil, der Tests aus „mit-daten“ hat, spielt vorher
  # app.spec.ts („ablauf“) selbst durch, weil diese Tests auf dessen Daten aufbauen. Gebaut wird in jedem
  # Teil, das läuft parallel und braucht kein Artefakt dazwischen
  e2e-teil:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: haben
          POSTGRES_PASSWORD: haben
          POSTGRES_DB: haben_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haben -d haben_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Chromium aus dem Cache, je Playwright-Version; die Systembibliotheken kommen bei jedem Lauf
      - id: playwright
        working-directory: apps/web
        run: echo "version=$(bun --bun playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: bun --bun playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: bun --bun playwright install-deps chromium
      - name: PostgreSQL ohne fsync
        run: docker exec ${{ job.services.postgres.id }} psql -U haben -d haben_e2e -qc "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - run: bun run build
      # Vier Worker (playwright.config.ts), so viele Kerne hat der Runner
      - name: Ende-zu-Ende-Tests, Teil ${{ matrix.teil }} von 3
        run: bun run e2e --shard=${{ matrix.teil }}/3
        env:
          E2E_DATABASE_URL: postgres://haben:haben@localhost:5432/haben_e2e
          # Der gebaute Server statt des Entwicklungsservers
          E2E_SERVER_COMMAND: bun .output/server/index.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-bericht-teil-${{ matrix.teil }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore

  # Ein Ergebnis für die Regeln auf main (geforderter Check „e2e“), egal in wie viele Teile die Tests zerfallen
  e2e:
    if: ${{ always() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    needs: [changes, e2e-teil]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-teil.result }}" = success

  kosit:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: bun install --frozen-lockfile
      - name: KoSIT-Validator und XRechnung-Konfiguration laden
        env:
          GH_TOKEN: ${{ github.token }}
          # Die Releases, gegen die die E-Rechnungen geprüft werden; Renovate hebt sie
          # (.github/renovate.json5)
          KOSIT_VALIDATOR: v1.6.3
          KOSIT_XRECHNUNG: v2026-08-31
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kosit/dl" "$RUNNER_TEMP/kosit/validator" "$RUNNER_TEMP/kosit/xr"
          # Die Dateinamen wechseln zwischen den Releases: bis 1.5 validator-x-distribution.zip mit
          # validationtool-x-standalone.jar darin, ab 1.6.1 validator-x-standalone.jar als eigene Datei
          gh release download "$KOSIT_VALIDATOR" --repo itplr-kosit/validator \
            --pattern 'validator-*.zip' --pattern '*-standalone.jar' --dir "$RUNNER_TEMP/kosit/dl"
          for zip in "$RUNNER_TEMP"/kosit/dl/*.zip; do unzip -q "$zip" -d "$RUNNER_TEMP/kosit/validator"; done
          find "$RUNNER_TEMP/kosit/dl" -maxdepth 1 -name '*-standalone.jar' -exec cp {} "$RUNNER_TEMP/kosit/validator/" \;
          # Die Konfiguration: das ZIP mit scenarios.xml (xrechnung-x-validator-configuration-datum.zip,
          # bis 2025 validator-configuration-xrechnung_x_datum.zip)
          gh release download "$KOSIT_XRECHNUNG" --repo itplr-kosit/validator-configuration-xrechnung \
            --pattern '*.zip' --dir "$RUNNER_TEMP/kosit/dl-xr"
          for zip in "$RUNNER_TEMP"/kosit/dl-xr/*.zip; do
            if unzip -Z1 "$zip" | grep -qx 'scenarios.xml'; then unzip -q "$zip" -d "$RUNNER_TEMP/kosit/xr"; break; fi
          done
          [ -f "$RUNNER_TEMP/kosit/xr/scenarios.xml" ] || { echo "::error::$KOSIT_XRECHNUNG: kein ZIP mit scenarios.xml"; exit 1; }
          jar="$(find "$RUNNER_TEMP/kosit/validator" -name '*-standalone.jar' ! -name '*java8*' | head -n1)"
          [ -n "$jar" ] || { echo "::error::$KOSIT_VALIDATOR: kein *-standalone.jar"; exit 1; }
          echo "KOSIT_JAR=$jar" >> "$GITHUB_ENV"
          echo "KOSIT_CONFIG=$RUNNER_TEMP/kosit/xr/scenarios.xml" >> "$GITHUB_ENV"
      - run: bun run --cwd packages/einvoice kosit "$RUNNER_TEMP/kosit/out"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kosit-reports
          path: ${{ runner.temp }}/kosit/out
          if-no-files-found: ignore

  container:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Den Build-Cache schreibt nur das Release: sonst könnte ein Pull Request Schichten
      # hineinlegen, die das nächste Release-Image übernimmt
      packages: read
    steps:
      - uses: actions/checkout@v7
      # Liest den Build-Cache des Releases: nur geänderte Schichten werden neu gebaut
      - name: Image bauen
        uses: firsttris/workflows/actions/docker-build@5011fb6bf2b7423d211ecffa82218ba067fb5fed # main
        with:
          dockerfile: Containerfile
          tags: haben:ci
      - name: Mit PostgreSQL starten
        run: |
          docker network create haben
          docker run -d --name haben-db --network haben -e POSTGRES_USER=haben -e POSTGRES_PASSWORD=haben -e POSTGRES_DB=haben postgres:18
          # Das Postgres-Image startet nach der Initialisierung einmal neu; erst danach ist es bereit
          for i in $(seq 1 60); do [ "$(docker logs haben-db 2>&1 | grep -c 'ready to accept connections')" -ge 2 ] && break; sleep 1; done
          docker run -d --name haben-app --network haben -p 3000:3000 \
            -e DATABASE_URL=postgres://haben:haben@haben-db:5432/haben \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e HABEN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e ELSTER_HERSTELLER_ID= \
            haben:ci
      - name: Prüfen
        run: |
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/login
          docker logs haben-app 2>&1 | grep -q "Migrationen angewendet"
          docker exec haben-app sh -c 'cd /app/packages/elster && bun -e "require.resolve(\"koffi\")"'
      - if: failure()
        run: docker logs haben-app || true

  # Die Entwicklungsumgebung aus compose.yml im Hauptordner: startet sie, läuft der Dev-Server mit Datenbank
  dev-compose:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Wie unter Linux üblich: erst `docker compose up` mit der Vorgabe-ID 1000, dann nach docs/entwicklung.md
      # mit der eigenen ID neu bauen. Die Volumes gehören danach noch der alten ID; der Start muss trotzdem gehen.
      - name: Erster Start mit der Vorgabe-ID
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do docker compose logs app | grep -q "Migrationen angewendet" && break; sleep 2; done
          docker compose logs app | grep -q "Migrationen angewendet"
          docker compose down
      - name: Starten
        run: |
          # Der Runner-Benutzer hat nicht die ID 1000; der Container muss in den Projektordner schreiben dürfen
          HABEN_DEV_UID="$(id -u)" HABEN_DEV_GID="$(id -g)" docker compose up -d --build
      - name: Prüfen
        run: |
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/login
          docker compose logs app | grep -q "Migrationen angewendet"
          docker compose logs app | grep -q "Einrichtungscode"
      - if: failure()
        run: docker compose logs

  backup:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    env:
      DOMAIN: haben.test
      DB_PASSWORD: haben
      AUTH_SECRET: ci
      ENCRYPTION_KEY: ci
      RESTIC_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7
      - name: Images bauen
        run: |
          docker build -t tristanteu/haben-backup:latest -f backup/Containerfile backup
          docker build -t tristanteu/haben-db:latest -f db/Containerfile db
      # Mit der compose.yml der Nutzer: Backup, Daten ändern, Wiederherstellen, alter Stand ist zurück
      - name: Backup und Wiederherstellen
        run: |
          set -x
          docker compose up -d db backup
          # Schema der App wie nach dem Start, damit Test-Restore, Kette und Stand in backup_status mitlaufen
          for f in ../apps/web/drizzle/*.sql; do docker compose exec -T db psql -U haben -d haben -X -q -v ON_ERROR_STOP=1 < "$f" > /dev/null; done
          docker compose exec -T db psql -U haben -d haben -qc "CREATE TABLE t (x text); INSERT INTO t VALUES ('vorher')"
          docker compose run --rm --no-deps -T --entrypoint sh restore -c 'mkdir -p /belege/ab && echo beleg > /belege/ab/cd && chown -R 1000:1000 /belege'
          # Ein Beleg unter seinem SHA-256 wie in der App, für die Stichprobe des Test-Restores
          sha="$(echo beleg | sha256sum | cut -d' ' -f1)"
          docker compose run --rm --no-deps -T --entrypoint sh restore -c "mkdir -p /belege/${sha:0:2} && echo beleg > /belege/${sha:0:2}/$sha"
          docker compose exec -T db psql -U haben -d haben -qc \
            "INSERT INTO documents (sha256, filename, mime_type, size, net, tax, gross) VALUES ('$sha', 'beleg.pdf', 'application/pdf', 6, 0, 0, 0)"
          docker compose exec -T backup backup.sh
          docker compose exec -T backup grep -q '^ok' /var/lib/haben-backup/status
          # Backup und der erste Test-Restore stehen als erfolgreich in der App
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT string_agg(kind || '=' || ok, ',' ORDER BY id) FROM backup_status")" \
            = "backup=true,restore_check=true"
          docker compose exec -T db psql -U haben -d haben -Atc "SELECT message FROM backup_status WHERE kind = 'restore_check'" | grep -q ', 1 Beleg,'
          test "$(docker compose exec -T db psql -U haben -d postgres -Atc "SELECT count(*) FROM pg_database WHERE datname LIKE 'haben\_restore\_check%'")" = 0
          docker compose exec -T db psql -U haben -d haben -qc "UPDATE t SET x = 'nachher'"
          docker compose run --rm --no-deps -T --entrypoint sh restore -c 'rm /belege/ab/cd && echo neu > /belege/neu'
          # Eine offene Verbindung wie die der laufenden App: der Restore bricht ab und ändert nichts
          docker compose exec -T -d db psql -U haben -d haben -c "SELECT pg_sleep(300)"
          active="SELECT count(*) FROM pg_stat_activity WHERE datname = 'haben' AND query LIKE '%pg_sleep(300)%' AND pid <> pg_backend_pid()"
          for _ in $(seq 20); do [ "$(docker compose exec -T db psql -U haben -d postgres -Atc "$active")" = 1 ] && break; sleep 0.5; done
          if echo ja | docker compose run --rm -T restore latest 2> restore.err; then exit 1; fi
          grep -q 'noch Verbindungen offen' restore.err
          test "$(docker compose exec -T db psql -U haben -d haben -Atc 'SELECT x FROM t')" = nachher
          docker compose exec -T db psql -U haben -d postgres -qAtc \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'haben' AND query LIKE '%pg_sleep(300)%' AND pid <> pg_backend_pid()"
          echo ja | docker compose run --rm -T restore latest
          test "$(docker compose exec -T db psql -U haben -d haben -Atc 'SELECT x FROM t')" = vorher
          docker compose run --rm --no-deps -T --entrypoint sh restore -c \
            'test "$(cat /belege/ab/cd)" = beleg && test ! -e /belege/neu && test "$(stat -c %u /belege/ab/cd)" = 1000'
      - if: failure()
        run: docker compose logs

  # Ein Bestand von postgres:16 (compose.yml bis Haben 0.2) unter dem neuen Backup-Image und danach
  # das automatische Upgrade durch haben-db beim Start, mit der compose.yml der Nutzer
  db-upgrade:
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    env:
      DOMAIN: haben.test
      DB_PASSWORD: haben
      AUTH_SECRET: ci
      ENCRYPTION_KEY: ci
      RESTIC_PASSWORD: ci
    steps:
      - uses: actions/checkout@v7
      - name: Images bauen
        run: |
          docker build -t tristanteu/haben-backup:latest -f backup/Containerfile backup
          docker build -t tristanteu/haben-db:latest -f db/Containerfile db
      - name: Upgrade von PostgreSQL 16
        run: |
          set -x
          printf 'services:\n  db:\n    image: postgres:16\n' > alt.yml
          docker compose -f compose.yml -f alt.yml up -d db backup
          for f in ../apps/web/drizzle/*.sql; do docker compose exec -T db psql -U haben -d haben -X -q -v ON_ERROR_STOP=1 < "$f" > /dev/null; done
          docker compose exec -T db psql -U haben -d haben -qc "CREATE TABLE t (x text); INSERT INTO t VALUES ('vorher')"
          # Das Backup-Image mit pg_dump 18 sichert die Datenbank 16 mit pg_dump 16; sonst scheitert der
          # Test-Restore am Einspielen in die Datenbank 16
          docker compose exec -T backup backup.sh
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT string_agg(kind || '=' || ok, ',' ORDER BY id) FROM backup_status")" \
            = "backup=true,restore_check=true"
          # Kein sauberes Herunterfahren, wie nach einem Absturz
          docker compose kill db
          docker compose up -d db backup
          docker compose logs db | grep -q "Upgrade auf PostgreSQL 18 fertig"
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT current_setting('server_version_num')::int / 10000")" = 18
          test "$(docker compose exec -T db psql -U haben -d haben -Atc 'SELECT x FROM t')" = vorher
          # Der alte Bestand liegt unverändert daneben, der neue in 18/docker
          docker compose exec -T db test -s /var/lib/postgresql/data/16/docker/PG_VERSION
          docker compose exec -T db test ! -e /var/lib/postgresql/data/PG_VERSION
          # Ein Neustart aktualisiert nicht noch einmal
          docker compose restart db
          docker compose up -d --wait db
          test "$(docker compose logs db | grep -c 'Aktualisiere die Datenbank')" = 1
          # Backup und Test-Restore nach dem Upgrade
          docker compose exec -T backup backup.sh
          docker compose exec -T backup restore-check.sh
          test "$(docker compose exec -T db psql -U haben -d haben -Atc "SELECT string_agg(kind || '=' || ok, ',' ORDER BY id) FROM backup_status")" \
            = "backup=true,restore_check=true,backup=true,restore_check=true"
      - if: failure()
        run: docker compose logs
