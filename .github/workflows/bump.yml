name: Bump version

# Erhöht die Version in package.json, taggt vX.Y.Z und startet release.yml auf dem Tag, ohne Checkout; dasselbe wie pnpm release:patch|minor|major.
# Release Candidates: preminor (oder prepatch, premajor) taggt vX.Y.Z-rc.1, prerelease den nächsten RC, patch danach die Version.
# Same scheme as in every project, see https://github.com/firsttris/workflows#bump-version
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major, preminor, prepatch, premajor, prerelease]
        default: patch

# Standard für alle Jobs; Jobs, die mehr brauchen, setzen eigene permissions
permissions:
  contents: read

jobs:
  bump:
    uses: firsttris/workflows/.github/workflows/bump-version.yml@main
    with:
      bump: ${{ inputs.bump }}
    permissions:
      contents: write
      actions: write
