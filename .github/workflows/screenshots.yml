name: Update screenshots

# Nimmt die Bilder in README und Doku (docs/screenshot-*.png) und das Vorschaubild neu auf und
# committet, was sich geändert hat: die Ende-zu-Ende-Tests legen die Daten an,
# e2e/zz-doku-screenshots.spec.ts fotografiert (bun run docs:screenshots). Nach einer Änderung am
# Aussehen von Hand starten.
on:
  workflow_dispatch:

jobs:
  screenshots:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@e3bd4641b5a30e09cf9551d6bdf49f4521252718 # main
    with:
      lockfile: bun.lock
      bun: true
      # Dieselbe Version wie packageManager in package.json; Renovate hebt beide zusammen
      bun-version: 1.4.4
      install: bun install --frozen-lockfile
      postgres: postgres:18
      # Die Tests leeren nur eine Datenbank, deren Name auf „e2e“ endet
      postgres-db: haben_e2e
      command: >-
        bun run build &&
        E2E_DATABASE_URL="$POSTGRES_URL" E2E_SERVER_COMMAND="bun .output/server/index.mjs" bun run docs:screenshots
      paths: |
        docs/screenshot-*.png
        docs/social-preview.png
      commit-message: Screenshots erneuert
    # Wie in bump.yml: das Ruleset auf main lehnt Pushes mit dem GITHUB_TOKEN ab, der Deploy Key
    # steht auf seiner Bypass-Liste. Der Commit mit den Bildern startet dann die CI auf main.
    secrets:
      deploy-key: ${{ secrets.BUMP_DEPLOY_KEY }}
    permissions:
      contents: write
