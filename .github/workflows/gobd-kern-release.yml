name: GoBD-Kern als Release

# Von Hand gestartet (Actions → GoBD-Kern als Release → Run workflow, auf main) baut der Workflow packages/gobd-kern
# als .tgz und legt Tag und GitHub-Release gobd-kern-vX.Y.Z mit der Datei an, X.Y.Z aus packages/gobd-kern/package.json.
# Unabhängig von den Releases der App (Tags v*); das Release ist nicht „Latest“. Andere Projekte installieren das
# Paket über die URL der Datei, ohne npm:
#   bun add https://github.com/firsttris/haben/releases/download/gobd-kern-vX.Y.Z/firsttris-gobd-kern-X.Y.Z.tgz
# Vorher laufen Typecheck und die Tests des Pakets gegen Postgres; gibt es die Version schon, bricht er ab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Tag und Release anlegen
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: haben
          POSTGRES_PASSWORD: haben
          POSTGRES_DB: haben_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haben -d haben_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Version lesen, vorhandenen Tag ablehnen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun -e 'console.log(require("./packages/gobd-kern/package.json").version)')"
          tag="gobd-kern-v$version"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag gibt es schon. Version in packages/gobd-kern/package.json erhöhen und mergen."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: bun run --cwd packages/gobd-kern typecheck
      - run: bun --bun vitest run packages/gobd-kern
        env:
          TEST_DATABASE_URL: postgres://haben:haben@localhost:5432/haben_test
      - run: bun pm pack --destination "$RUNNER_TEMP/paket"
        working-directory: packages/gobd-kern
      # gh legt den Tag auf dem geprüften Commit an; ein Tag aus GITHUB_TOKEN startet keine weiteren Workflows
      - name: Tag und Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          datei="$(ls "$RUNNER_TEMP"/paket/*.tgz)"
          gh release create "$TAG" "$datei" --target "$GITHUB_SHA" --latest=false --title "$TAG" \
            --notes "Paket @firsttris/gobd-kern ${TAG#gobd-kern-v}. Installieren: bun add https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$datei")"
