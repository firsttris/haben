name: GoBD-Kern als Release

# Ein Tag gobd-kern-vX.Y.Z baut packages/gobd-kern als .tgz und hängt es an ein GitHub-Release, unabhängig von den
# Releases der App (Tags v*). Andere Projekte installieren es über die URL der Datei, ohne npm:
#   bun add https://github.com/firsttris/haben/releases/download/gobd-kern-vX.Y.Z/firsttris-gobd-kern-X.Y.Z.tgz
# Der Tag muss zur version in packages/gobd-kern/package.json passen; vorher laufen Typecheck und die Tests des
# Pakets gegen Postgres. Das Release ist nicht „Latest“, damit die Releases der App oben bleiben.
on:
  push:
    tags: ["gobd-kern-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # das Release anlegen
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: haben
          POSTGRES_PASSWORD: haben
          POSTGRES_DB: haben_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haben -d haben_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Tag gegen die Version des Pakets prüfen
        run: |
          version="$(bun -e 'console.log(require("./packages/gobd-kern/package.json").version)')"
          test "$GITHUB_REF_NAME" = "gobd-kern-v$version" || { echo "Tag $GITHUB_REF_NAME passt nicht zu Version $version"; exit 1; }
      - run: bun run --cwd packages/gobd-kern typecheck
      - run: bun --bun vitest run packages/gobd-kern
        env:
          TEST_DATABASE_URL: postgres://haben:haben@localhost:5432/haben_test
      - run: bun pm pack --destination "$RUNNER_TEMP/paket"
        working-directory: packages/gobd-kern
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          datei="$(ls "$RUNNER_TEMP"/paket/*.tgz)"
          gh release create "$GITHUB_REF_NAME" "$datei" --latest=false --title "$GITHUB_REF_NAME" --notes "Paket @firsttris/gobd-kern ${GITHUB_REF_NAME#gobd-kern-v}. Installieren: bun add https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$datei")"
