<!doctype html>
<!-- Vorlage für das Social-Media-Bild des Repos (Settings → Social preview), 1280 × 640.
     Im Stil des Bilds oben in der README (scripts/hero/hero.html): links die Navigation der App, rechts die Übersicht.
     Ein Bild für alle Umgebungen, deshalb hell (Wald); die dunkle Navigation trägt es auch auf dunklem Grund.
     Rendern: bun run docs:social-preview → docs/social-preview.png -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../../apps/web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("../../apps/web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../../apps/web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }

  /* Wald, wie :root in apps/web/src/styles.css */
  :root { --ink: #16211c; --ground: #f4f5f2; --line: #dde2de; --brand: #3fa284; --nav: #16211c; --nav-active: #2a3b34; --nav-ink: #b9c4be; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { position: relative; display: flex; font-family: "IBM Plex Sans", system-ui, sans-serif; background: var(--ground); color: var(--ink); }

  .side { width: 440px; flex: none; background: var(--nav); color: var(--nav-ink); padding: 56px 48px; display: flex; flex-direction: column; position: relative; z-index: 1; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .logo { width: 72px; height: 72px; border-radius: 16px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 40px; font-weight: 600; }
  .name { font-size: 56px; font-weight: 600; color: #fff; letter-spacing: -0.8px; }
  .claim { margin-top: 40px; font-size: 44px; line-height: 52px; font-weight: 600; color: #fff; letter-spacing: -0.8px; }
  /* Zweite Zeile in der Markenfarbe, wie im Hero der README */
  .claim span { color: var(--brand); }
  .sub { margin-top: 16px; font-size: 20px; line-height: 28px; }
  .facts { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .facts span { font-size: 15px; line-height: 20px; padding: 6px 10px; border-radius: 16px; background: var(--nav-active); }

  /* Die Übersicht ohne ihre Navigation läuft rechts und unten aus dem Bild, das Handy liegt darüber */
  .shot { position: absolute; left: 488px; top: 56px; width: 960px; border: 1px solid var(--line); border-radius: 12px 0 0 0; overflow: hidden; }
  /* Ohne die Navigation der App: die steht links schon */
  .shot img { width: 1080px; margin-left: -174px; display: block; }
  /* Handy rechts, unten angeschnitten wie aus dem Bild ragend: Rahmen 3 % und Ecken 17 % der Breite wie ein
     aktuelles Handy, Kante, Seitentasten,
     Statusleiste in der Farbe der Kopfzeile der App am Handy und Kamera als Pille. Das Bild selbst hat keine Statusleiste */
  .phone { position: absolute; right: 40px; top: 176px; width: 244px; height: 504px; padding: 7px 7px 0; background: #0b100e; border-radius: 41px 41px 0 0; box-shadow: 0 0 0 1.5px #3a4741, 0 16px 40px rgba(22, 33, 28, 0.25); }
  .phone::before, .phone::after { content: ""; position: absolute; width: 3px; border-radius: 2px; background: #3a4741; }
  .phone::before { left: -4px; top: 96px; height: 48px; box-shadow: 0 -64px 0 0 #3a4741; }
  .phone::after { right: -4px; top: 120px; height: 72px; }
  .phone .screen { position: relative; height: 100%; border-radius: 34px 34px 0 0; overflow: hidden; padding-top: 30px; background: var(--nav); }
  .phone .screen img { width: 100%; display: block; }
  .phone .time { position: absolute; top: 8px; left: 26px; font-size: 13px; font-weight: 600; color: #fff; }
  .phone .bars { position: absolute; top: 11px; right: 22px; display: flex; gap: 2px; align-items: flex-end; }
  .phone .bars i { display: block; width: 3px; border-radius: 1px; background: #fff; }
  .phone .island { position: absolute; top: 7px; left: 50%; width: 72px; height: 20px; margin-left: -36px; border-radius: 10px; background: #000; }
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><div class="logo">H</div><div class="name">Haben</div></div>
    <p class="claim">Deine Bücher.<br><span>Dein Server.</span></p>
    <p class="sub">Open-Source-Buchhaltung für Freiberufler, Selbstständige und kleine GmbHs.</p>
    <div class="facts"><span>E-Rechnung</span><span>ELSTER</span><span>GoBD</span><span>AGPL</span></div>
  </aside>
  <div class="shot"><img src="../../docs/screenshot-uebersicht.png" alt=""></div>
  <div class="phone"><div class="screen"><img src="../../docs/screenshot-mobil.png" alt=""><div class="island"></div><div class="time">9:41</div><div class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></div></div></div>
</body>
</html>
