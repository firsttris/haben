<!doctype html>
<!-- Vorlage für das Social-Media-Bild des Repos (Settings → Social preview), 1280 × 640.
     Wie das Bild oben in der README (scripts/hero/hero.html), größer gesetzt: links der Slogan in IBM Plex Serif,
     rechts Rechnung und Zahlung mit Abgleich, GoBD und ELSTER. Ein Bild für alle Umgebungen, deshalb hell (Wald).
     Rendern: bun run docs:social-preview → docs/social-preview.png -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../../apps/web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("../../apps/web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../../apps/web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Serif"; font-weight: 600; src: url("../../packages/einvoice/fonts/IBMPlexSerif-SemiBold.ttf") format("truetype"); }

  /* Wald, wie :root in apps/web/src/styles.css */
  :root { --ink: #16211c; --ink-2: #3f4a44; --muted: #56625c; --ground: #f4f5f2; --line: #dde2de; --brand: #3fa284; --accent-ink: #17574a;
    --sans: "IBM Plex Sans", system-ui, sans-serif; --serif: "IBM Plex Serif", Georgia, serif; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); padding: 64px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 600; }
  .logo { width: 52px; height: 52px; border-radius: 14px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 34px; }
  .inhalt { flex: 1; display: grid; grid-template-columns: 1fr 520px; gap: 64px; align-items: center; }
  h1 { font: 600 80px/94px var(--serif); letter-spacing: -1.4px; }
  h1 span { display: block; color: var(--accent-ink); }
  .beschreibung { margin-top: 20px; font-size: 24px; line-height: 34px; color: var(--ink-2); }
  .auszug { padding-left: 26px; border-left: 4px solid var(--brand); }
  .zeile { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 10px 0 14px; }
  .zeile + .zeile { border-top: 1px solid var(--line); }
  .was { font-size: 22px; font-weight: 500; line-height: 30px; }
  .wer { font-size: 18px; line-height: 26px; color: var(--muted); }
  .betrag { font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
  dl { display: grid; grid-template-columns: 96px 1fr; gap: 6px 14px; margin-top: 16px; font-size: 18px; line-height: 26px; }
  dt { font-weight: 600; color: var(--accent-ink); }
  dd { color: var(--ink-2); }
</style>
</head>
<body>
  <div class="brand"><span class="logo">H</span>Haben</div>
  <div class="inhalt">
    <section>
      <h1>Deine Bücher.<span>Dein Server.</span></h1>
      <p class="beschreibung">Open-Source-Buchhaltung für Freiberufler, Selbstständige und kleine GmbHs.</p>
    </section>
    <section class="auszug">
      <div class="zeile"><div><div class="was">E-Rechnung 2026-034</div><div class="wer">Studio Linde, ZUGFeRD</div></div><div class="betrag">1.725,50 €</div></div>
      <div class="zeile"><div><div class="was">Zahlungseingang</div><div class="wer">Girokonto, RE 2026-034</div></div><div class="betrag">1.725,50 €</div></div>
      <dl>
        <dt>Abgleich</dt><dd>Zahlung zugeordnet</dd>
        <dt>GoBD</dt><dd>Festgeschrieben</dd>
        <dt>ELSTER</dt><dd>Voranmeldung Oktober</dd>
      </dl>
    </section>
  </div>
</body>
</html>
