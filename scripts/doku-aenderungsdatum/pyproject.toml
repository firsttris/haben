# Markdown-Erweiterung für die Doku (mkdocs.yml, markdown_extensions): Änderungsdatum unter jeder Seite.
# Wird über requirements-docs.txt mit installiert, damit `zensical build` und `zensical serve` sie finden.
[project]
name = "haben-doku-aenderungsdatum"
version = "0.1.0"
description = "Änderungsdatum aus git unter jeder Seite der Doku von Haben (Zensical)"
requires-python = ">=3.11"
dependencies = ["markdown"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["haben_doku_aenderungsdatum.py"]
