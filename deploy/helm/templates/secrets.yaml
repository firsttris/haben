{{- define "haben.dbPassword" -}}
{{- $value := index (index . 0).Values.postgresql (index . 1) | toString -}}
{{- if not (regexMatch "^[A-Za-z0-9]+$" $value) -}}
{{- fail (printf "postgresql.%s fehlt oder enthält andere Zeichen als Buchstaben und Ziffern; sie steht in der Verbindungs-URL (openssl rand -hex 24)" (index . 1)) -}}
{{- end -}}
{{- $value -}}
{{- end -}}

{{- define "haben.secret" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  labels:
    {{- include "haben.labels" .root | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .data }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end -}}

{{- if not .Values.app.existingSecret }}
{{- $data := dict }}
{{- range $name, $value := .Values.app.secretEnv }}
{{- include "haben.text" (list (printf "app.secretEnv.%s" $name) $value) }}
{{- if $value }}{{ $_ := set $data $name $value }}{{ end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- if .Values.postgresql.existingSecret }}
{{- fail "Mit postgresql.existingSecret kennt das Chart die Passwörter nicht: app.existingSecret mit DATABASE_URL und MIGRATION_DATABASE_URL angeben" }}
{{- end }}
{{- $host := include "haben.dbHost" . }}
{{- $_ := set $data "DATABASE_URL" (printf "postgres://haben_app:%s@%s:5432/haben" (include "haben.dbPassword" (list . "appPassword")) $host) }}
{{- $_ := set $data "MIGRATION_DATABASE_URL" (printf "postgres://haben:%s@%s:5432/haben" (include "haben.dbPassword" (list . "password")) $host) }}
{{- end }}
{{- range list "BETTER_AUTH_SECRET" "HABEN_ENCRYPTION_KEY" "DATABASE_URL" }}
{{- if not (hasKey $data .) }}
{{- fail (printf "app.secretEnv.%s fehlt" .) }}
{{- end }}
{{- end }}
{{ include "haben.secret" (dict "root" . "name" (include "haben.appSecret" .) "data" $data) }}
{{- end }}

{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
---
{{ include "haben.secret" (dict "root" . "name" (include "haben.dbSecret" .) "data" (dict
  "POSTGRES_PASSWORD" (include "haben.dbPassword" (list . "password"))
  "APP_PASSWORD" (include "haben.dbPassword" (list . "appPassword"))
)) }}
{{- end }}

{{- if and .Values.backup.enabled (not .Values.backup.existingSecret) }}
{{- $data := dict }}
{{- range $name, $value := .Values.backup.secretEnv }}
{{- include "haben.text" (list (printf "backup.secretEnv.%s" $name) $value) }}
{{- if $value }}{{ $_ := set $data $name $value }}{{ end }}
{{- end }}
{{- if not $data.RESTIC_PASSWORD }}
{{- fail "backup.secretEnv.RESTIC_PASSWORD fehlt" }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not $data.PGPASSWORD) }}
{{- fail "backup.secretEnv.PGPASSWORD fehlt: Ohne postgresql.enabled braucht das Backup den Eigentümerzugang zur Datenbank" }}
{{- end }}
---
{{ include "haben.secret" (dict "root" . "name" (include "haben.backupSecret" .) "data" $data) }}
{{- end }}
