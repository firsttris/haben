# Haben mit Docker Compose: App, PostgreSQL und Caddy (HTTPS mit automatischem Zertifikat).
#
#   mkdir haben && cd haben
#   curl -O https://raw.githubusercontent.com/firsttris/haben/main/deploy/compose.yml
#   curl -o .env https://raw.githubusercontent.com/firsttris/haben/main/deploy/compose.env.example
#   # .env ausfüllen: Domain, Datenbank-Passwort, die beiden Schlüssel und das Backup-Passwort
#   docker compose up -d
#
# Backup von Hand, etwa vor einem Update:  docker compose exec backup backup.sh
#
# Braucht Docker Compose 2.23 oder neuer (für die eingebettete Caddy-Konfiguration).
name: haben

# Gemeinsam für das tägliche Backup und das Wiederherstellen (Image aus deploy/backup)
x-backup: &backup
  image: tristanteu/haben-backup:latest
  depends_on:
    db:
      condition: service_healthy
  environment:
    PGPASSWORD: ${DB_PASSWORD}
    # Standard: Volume backups auf diesem Host. Besser ein zweites System: sftp:…, s3:…, rest:…
    RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups}
    RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD fehlt in .env}
    # Eigener Name je Instanz, wenn mehrere ein Repository teilen
    BACKUP_HOST: ${BACKUP_HOST:-haben}
    BACKUP_TIME: ${BACKUP_TIME:-03:15}
    # Test-Restore nach dem Backup alle so viele Tage, 0 schaltet ihn ab
    RESTORE_CHECK_DAYS: ${RESTORE_CHECK_DAYS:-7}
    # Zugangsdaten für ein Repository auf S3, sonst leer
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  db:
    # postgres mit automatischem Upgrade: Liegt im Volume noch eine ältere Version (etwa von postgres:16),
    # hebt der Container sie beim Start mit pg_upgrade an (deploy/db)
    image: tristanteu/haben-db:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: haben
      POSTGRES_DB: haben
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "haben"]
      interval: 5s
      retries: 20
      # Ein Upgrade auf eine neue Major-Version läuft vor dem Start und braucht je nach Größe ein paar Minuten
      start_period: 10m

  app:
    image: tristanteu/haben:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Gehärtet: Dateisystem schreibgeschützt bis auf die Volumes unten und /tmp, keine Capabilities, keine neuen Rechte
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://haben:${DB_PASSWORD}@db:5432/haben
      # Betriebsart: false lokale Anmeldung, true ausschließlich OpenID Connect mit Rollen aus Gruppen (docs/installation.md)
      OIDC_ONLY: ${OIDC_ONLY:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_GROUP_INHABER: ${OIDC_GROUP_INHABER:-}
      OIDC_GROUP_STEUERBERATUNG: ${OIDC_GROUP_STEUERBERATUNG:-}
      BETTER_AUTH_URL: https://${DOMAIN:?DOMAIN fehlt in .env}
      BETTER_AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET fehlt in .env}
      HABEN_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt in .env}
      ERIC_HOME: ${ERIC_HOME:-}
      ERIC_AUTO_INSTALL: ${ERIC_AUTO_INSTALL:-}
      ERIC_SHA256: ${ERIC_SHA256:-}
      # ELSTER auf arm64: startet den ERiC-Worker emuliert als x86_64 (docs/installation.md, „ELSTER auf arm64“)
      ERIC_WORKER_COMMAND: ${ERIC_WORKER_COMMAND:-}
      ELSTER_HERSTELLER_ID: ${ELSTER_HERSTELLER_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Oder ein OpenAI-kompatibler Dienst (z. B. Ollama, OpenRouter); dann geht kein Beleg an Anthropic
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-}
      EXTRACTION_BASE_URL: ${EXTRACTION_BASE_URL:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      EXTRACTION_API_KEY: ${EXTRACTION_API_KEY:-}
      EXTRACTION_TIMEOUT_SECONDS: ${EXTRACTION_TIMEOUT_SECONDS:-}
      EXTRACTION_MAX_PAGES: ${EXTRACTION_MAX_PAGES:-}
      EXTRACTION_INPUT: ${EXTRACTION_INPUT:-}
      EXTRACTION_EXTRA_BODY: ${EXTRACTION_EXTRA_BODY:-}
      HABEN_LAYOUTS_MAX: ${HABEN_LAYOUTS_MAX:-}
      HABEN_LAYOUTS_MAX_MB: ${HABEN_LAYOUTS_MAX_MB:-}
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_KEY_FILE: /run/secrets/enablebanking.pem
    volumes:
      # Belegdateien: gehören ins Backup, GoBD-Aufbewahrung 10 Jahre
      - belege:/var/lib/haben/belege
      # Protokolle von ERiC (eric.log), zur Fehlersuche bei der Übermittlung
      - eric-log:/var/lib/haben/eric-log
      # ERiC, von Haben heruntergeladen (Einstellungen › ERiC oder ERIC_AUTO_INSTALL=ja)
      - eric:/var/lib/haben/eric
      # Alternativ ERiC von Hand: nach /opt/eric entpacken, Zeile einkommentieren, ERIC_HOME=/opt/eric in .env
      # - /opt/eric:/opt/eric:ro
      # ELSTER auf arm64: x86_64-Laufzeit aus deploy/eric-x86_64/einrichten.sh, Zeile einkommentieren, ERIC_WORKER_COMMAND in .env
      # - /opt/haben-x86_64:/opt/haben-x86_64:ro
      # Automatischer Kontoabruf: privater Schlüssel der Enable-Banking-Anwendung, Zeile einkommentieren
      # - ./enablebanking.pem:/run/secrets/enablebanking.pem:ro
    # KI-Dienst (z. B. Ollama) direkt auf dem Server: unter Linux kennt der Container host.docker.internal nur so
    # extra_hosts:
    #   - host.docker.internal:host-gateway

  # Tägliches Backup von Datenbank und Belegen mit restic
  backup:
    <<: *backup
    restart: unless-stopped
    volumes:
      - belege:/belege:ro
      - backups:/backups
      # Repository über sftp: SSH-Schlüssel einhängen, Zeile einkommentieren
      # - ~/.ssh:/root/.ssh:ro
    healthcheck:
      # Ungesund, wenn der letzte Lauf fehlschlug oder seit zwei Tagen keiner durchlief; vor dem ersten Lauf gesund
      test: ["CMD-SHELL", "s=/var/lib/haben-backup/status; [ ! -f $$s ] || { grep -q '^ok' $$s && [ -n \"$$(find $$s -mmin -2880)\" ]; }"]
      interval: 5m

  # Wiederherstellen, startet nicht mit up:  docker compose stop app && docker compose run --rm restore latest
  restore:
    <<: *backup
    profiles: [restore]
    entrypoint: ["restore.sh"]
    volumes:
      - belege:/belege
      - backups:/backups
      # - ~/.ssh:/root/.ssh:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy:/data

configs:
  caddyfile:
    content: |
      ${DOMAIN} {
        encode zstd gzip
        header {
          Strict-Transport-Security "max-age=31536000; includeSubDomains"
          X-Content-Type-Options nosniff
          Referrer-Policy same-origin
          X-Frame-Options SAMEORIGIN
        }
        # Uploads: Archivdateien bis 100 MB, Belege bis 20 MB je Datei; mehrere Dateien gehen in einer Anfrage
        request_body {
          max_size 250MB
        }
        reverse_proxy app:3000
      }

volumes:
  db:
  belege:
  eric-log:
  eric:
  caddy:
  # restic-Repository, wenn RESTIC_REPOSITORY nicht gesetzt ist
  backups:
