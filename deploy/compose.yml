# Haben mit Docker Compose: App, PostgreSQL und Caddy (HTTPS mit automatischem Zertifikat).
#
#   mkdir haben && cd haben
#   curl -O https://raw.githubusercontent.com/firsttris/haben/main/deploy/compose.yml
#   curl -o .env https://raw.githubusercontent.com/firsttris/haben/main/deploy/compose.env.example
#   # .env ausfüllen: Domain, Datenbank-Passwort, die beiden Schlüssel und das Backup-Passwort
#   docker compose up -d
#
# Backup von Hand, etwa vor einem Update:  docker compose exec backup backup.sh
#
# Braucht Docker Compose 2.23 oder neuer (für die eingebettete Caddy-Konfiguration).
name: haben

# Gemeinsam für das tägliche Backup und das Wiederherstellen (Image aus deploy/backup)
x-backup: &backup
  image: tristanteu/haben-backup:latest
  depends_on:
    db:
      condition: service_healthy
  environment:
    PGPASSWORD: ${DB_PASSWORD}
    # Standard: Volume backups auf diesem Host. Besser ein zweites System: sftp:…, s3:…, rest:…
    RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups}
    RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD fehlt in .env}
    # Eigener Name je Instanz, wenn mehrere ein Repository teilen
    BACKUP_HOST: ${BACKUP_HOST:-haben}
    BACKUP_TIME: ${BACKUP_TIME:-03:15}
    # Zugangsdaten für ein Repository auf S3, sonst leer
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: haben
      POSTGRES_DB: haben
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "haben"]
      interval: 5s
      retries: 20

  app:
    image: tristanteu/haben:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://haben:${DB_PASSWORD}@db:5432/haben
      BETTER_AUTH_URL: https://${DOMAIN:?DOMAIN fehlt in .env}
      BETTER_AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET fehlt in .env}
      HABEN_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt in .env}
      ERIC_HOME: ${ERIC_HOME:-}
      ERIC_AUTO_INSTALL: ${ERIC_AUTO_INSTALL:-}
      ELSTER_HERSTELLER_ID: ${ELSTER_HERSTELLER_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_KEY_FILE: /run/secrets/enablebanking.pem
    volumes:
      # Belegdateien: gehören ins Backup, GoBD-Aufbewahrung 10 Jahre
      - belege:/var/lib/haben/belege
      # Protokolle von ERiC (eric.log), zur Fehlersuche bei der Übermittlung
      - eric-log:/var/lib/haben/eric-log
      # ERiC, von Haben heruntergeladen (Einstellungen › ERiC oder ERIC_AUTO_INSTALL=ja)
      - eric:/var/lib/haben/eric
      # Alternativ ERiC von Hand: nach /opt/eric entpacken, Zeile einkommentieren, ERIC_HOME=/opt/eric in .env
      # - /opt/eric:/opt/eric:ro
      # Automatischer Kontoabruf: privater Schlüssel der Enable-Banking-Anwendung, Zeile einkommentieren
      # - ./enablebanking.pem:/run/secrets/enablebanking.pem:ro

  # Tägliches Backup von Datenbank und Belegen mit restic
  backup:
    <<: *backup
    restart: unless-stopped
    volumes:
      - belege:/belege:ro
      - backups:/backups
      # Repository über sftp: SSH-Schlüssel einhängen, Zeile einkommentieren
      # - ~/.ssh:/root/.ssh:ro
    healthcheck:
      # Ungesund, wenn der letzte Lauf fehlschlug oder seit zwei Tagen keiner durchlief; vor dem ersten Lauf gesund
      test: ["CMD-SHELL", "s=/var/lib/haben-backup/status; [ ! -f $$s ] || { grep -q '^ok' $$s && [ -n \"$$(find $$s -mmin -2880)\" ]; }"]
      interval: 5m

  # Wiederherstellen, startet nicht mit up:  docker compose stop app && docker compose run --rm restore latest
  restore:
    <<: *backup
    profiles: [restore]
    entrypoint: ["restore.sh"]
    volumes:
      - belege:/belege
      - backups:/backups
      # - ~/.ssh:/root/.ssh:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy:/data

configs:
  caddyfile:
    content: |
      ${DOMAIN} {
        encode zstd gzip
        header {
          Strict-Transport-Security "max-age=31536000; includeSubDomains"
          X-Content-Type-Options nosniff
          Referrer-Policy same-origin
          X-Frame-Options SAMEORIGIN
        }
        # Uploads: Archivdateien bis 100 MB, Belege bis 20 MB je Datei; mehrere Dateien gehen in einer Anfrage
        request_body {
          max_size 250MB
        }
        reverse_proxy app:3000
      }

volumes:
  db:
  belege:
  eric-log:
  eric:
  caddy:
  # restic-Repository, wenn RESTIC_REPOSITORY nicht gesetzt ist
  backups:
