<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Haben</title>
  <desc id="d">Haben: Rechnung schreiben, Zahlung zuordnen, Voranmeldung an ELSTER senden</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a23"/>
      <stop offset="1" stop-color="#101814"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#3fa284" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3fa284" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#23332c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="23.5" fill="none" stroke="#2a3b34"/>

  <!-- Logo wie in der App -->
  <g transform="translate(64 60) scale(2.5)">
    <rect width="32" height="32" rx="8" fill="#3fa284"/>
    <text x="16" y="22.5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="18" fill="#16211c">H</text>
  </g>
  <text x="168" y="120" fill="#eef3f0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Haben</text>
  <text x="66" y="184" fill="#b9c4be" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">Buchhaltung für Freiberufler: Rechnung, Bankabgleich und Voranmeldung, selbst gehostet.</text>

  <!-- Ablauf: Rechnung → Zahlung → Voranmeldung → ELSTER -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(64 228)">
      <rect width="262" height="92" rx="14" fill="#14201b" stroke="#2a3b34"/>
      <text x="22" y="34" fill="#8fa098" font-size="14">Rechnung festgeschrieben</text>
      <text x="22" y="66" fill="#eef3f0" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2026-031</text>
      <text x="240" y="66" text-anchor="end" fill="#8fa098" font-size="14">ZUGFeRD</text>
    </g>
    <path d="M338 274h26m-8-7 8 7-8 7" fill="none" stroke="#3fa284" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(376 228)">
      <rect width="262" height="92" rx="14" fill="#14201b" stroke="#2a3b34"/>
      <text x="22" y="34" fill="#8fa098" font-size="14">Zahlungseingang zugeordnet</text>
      <text x="22" y="66" fill="#6fd1ad" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">+10.852,80 €</text>
    </g>
    <path d="M650 274h26m-8-7 8 7-8 7" fill="none" stroke="#3fa284" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(688 228)">
      <rect width="262" height="92" rx="14" fill="#14201b" stroke="#2a3b34"/>
      <text x="22" y="34" fill="#8fa098" font-size="14">Voranmeldung September</text>
      <text x="22" y="66" fill="#eef3f0" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Kz 81  9.120 €</text>
    </g>
    <path d="M962 274h26m-8-7 8 7-8 7" fill="none" stroke="#3fa284" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1000 228)">
      <rect width="216" height="92" rx="14" fill="#3fa284" fill-opacity="0.14" stroke="#3fa284" stroke-opacity="0.6"/>
      <text x="22" y="34" fill="#8fd6bb" font-size="14">an ELSTER übermittelt</text>
      <path d="M24 60l8 8 16-17" fill="none" stroke="#6fd1ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="68" fill="#eef3f0" font-size="21" font-weight="600">gesendet</text>
    </g>
  </g>
</svg>
